<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>活動報到轉址中...</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body style="font-family: sans-serif; text-align: center; padding-top: 50px;">
  <p>正在讀取您的 LINE 身分並前往問卷，請稍候...</p>
  <script>
    // 【請修改這裡】換成你的 SurveyCake 問卷網址
    var surveyUrl = "https://www.surveycake.com/s/Z2vrM";
    var myLiffId = "2011983559-wVtxvNQD";

    liff.init({ liffId: myLiffId }).then(function() {
      if (!liff.isLoggedIn()) {
        liff.login();
      } else {
        liff.getProfile().then(function(profile) {
          window.location.replace(surveyUrl + "?uid=" + profile.userId);
        });
      }
    }).catch(function(err) {
      alert("發生錯誤：" + err);
    });
  </script>
</body>
</html>
